steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - 'gcloud auth configure-docker us-central1-docker.pkg.dev --quiet'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg'
      - 'BUILD_ID=$BUILD_ID'
      - '--build-arg'
      - 'APP_VERSION=${_APP_VERSION}'
      - '-t'
      - 'us-central1-docker.pkg.dev/lot-ledger/lot-ledger-api/api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/lot-ledger/lot-ledger-api/api:develop'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/lot-ledger/lot-ledger-api/api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - lot-ledger-dev
      - '--image=us-central1-docker.pkg.dev/lot-ledger/lot-ledger-api/api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--project=lot-ledger'
      - '--timeout=3600'
      - '--memory=1Gi'
      - '--update-env-vars=DEEP_PULL_EXPERIMENT=true,PHASE_2_CACHE_READ=true,BUILD_ID=$BUILD_ID,APP_VERSION=${_APP_VERSION}'
      - '--quiet'

substitutions:
  _APP_VERSION: 'dev'

options:
  logging: CLOUD_LOGGING_ONLY
