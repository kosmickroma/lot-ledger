<!-- frontend/index.html
     Single-page app shell. Loads Leaflet + Leaflet.draw from CDN,
     mounts the map and sidebar layout, then hands off all logic to map.js.
     Connects to: frontend/map.js, frontend/style.css, CDN Leaflet 1.9.4 + Leaflet.draw 1.0.4
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LotLedger</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" crossorigin="">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <p class="eyebrow">Lot Ledger</p>
        <h1>Parcel Analysis</h1>
        <p id="brush-status" class="sidebar-chip hidden">Active Tool: None</p>
      </div>
      <div id="layer-toggles" class="layer-toggles">
        <p class="sidebar-label">Sources</p>
        <label class="layer-toggle-row">
          <input type="checkbox" id="toggle-redfin">
          <span>Redfin Listings</span>
        </label>
        <p id="redfin-toggle-status" class="sidebar-note"></p>
      </div>
      <div id="sidebar-instructions" class="sidebar-section">
        <p class="sidebar-copy">Draw a polygon around a target pocket to analyze parcels instantly.</p>
        <p class="sidebar-note">Shortcuts: Enter or right-click to finish. Esc to cancel.</p>
      </div>
      <div id="sidebar-loading" class="sidebar-section hidden">
        <div class="spinner"></div>
        <p class="sidebar-copy">Loading parcels...</p>
        <p id="redfin-status" class="sidebar-note">Pulling Redfin listings...</p>
      </div>
      <div id="sidebar-results" class="sidebar-section hidden">
        <div id="counts-panel" class="counts-panel"></div>
        <div class="sidebar-actions">
          <button id="btn-download" class="btn-primary">Download CSV</button>
          <button id="btn-clear" class="btn-secondary">Clear</button>
        </div>
        <div id="parcel-list" class="parcel-list"></div>
      </div>
    </aside>
    <main class="map-panel">
      <button id="sidebar-toggle" class="sidebar-toggle" aria-expanded="true" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
          <path d="M12.5 4 L6.5 10 L12.5 16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div id="draw-helper" class="draw-helper hidden">Enter/right-click to finish, Esc to cancel</div>
      <div id="map" aria-label="Dallas parcel map"></div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js" crossorigin=""></script>
  <script src="https://unpkg.com/protomaps-leaflet@latest/dist/protomaps-leaflet.min.js"></script>
  <script src="/map.js"></script>
</body>
</html>
